services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: ${TZ}
      DJ_DEFAULT_ADMIN_USERNAME: ${DJ_DEFAULT_ADMIN_USERNAME}
      DJ_DEFAULT_ADMIN_PASSWORD: ${DJ_DEFAULT_ADMIN_PASSWORD}
    volumes:
      - dujiao_uploads:/app/uploads
      - dujiao_logs:/app/logs
      - ../files/config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - dokploy-network
      - postgres-net
      - redis-net

volumes:
  dujiao_uploads:
  dujiao_logs:

networks:
  dokploy-network:
    external: true
  postgres-net:
    external: true
  redis-net:
    external: true
